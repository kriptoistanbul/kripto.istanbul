<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#f7f0e5">
<title>Mehmet & Fatma | Nişan Töreni</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f0e5}
body{font-family:Georgia,"Times New Roman",serif;color:#65451f;cursor:none}
.screen{position:relative;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;isolation:isolate;background:radial-gradient(circle at 50% 45%,rgba(255,255,255,.98) 0 24%,rgba(255,250,242,.82) 54%,rgba(239,218,187,.72) 100%),linear-gradient(135deg,#fffaf2,#ead4b7)}
.screen:before{content:"";position:absolute;inset:3.2vh 2vw;border:1px solid rgba(176,128,54,.62);border-radius:1.4vw;box-shadow:inset 0 0 80px rgba(181,131,63,.09);z-index:-1}
.glow{position:absolute;width:44vw;height:44vw;border-radius:50%;filter:blur(80px);opacity:.18;background:#d9aa65;z-index:-2}
.g1{top:-27vw;left:-19vw}.g2{right:-20vw;bottom:-29vw}
.corner{position:absolute;width:25vw;height:25vw;opacity:.72;color:#a77532}
.corner svg{width:100%;height:100%;overflow:visible}
.tl{top:-1.5vw;left:-1vw}.br{right:-1vw;bottom:-1.5vw;transform:rotate(180deg)}
.tr{top:-7vw;right:-7vw;transform:rotate(88deg);opacity:.28}.bl{left:-7vw;bottom:-7vw;transform:rotate(-92deg);opacity:.28}
.content{text-align:center;transform:translateY(-1vh);padding:4vw;width:min(88vw,1500px)}
.eyebrow{font-family:Arial,sans-serif;font-size:clamp(17px,1.55vw,30px);font-weight:400;letter-spacing:.38em;text-transform:uppercase;color:#a2773d;margin-bottom:3.4vh}
.ornament{display:flex;align-items:center;gap:1.4vw;justify-content:center;color:#b48643;margin:0 auto 3.1vh}
.ornament:before,.ornament:after{content:"";height:1px;width:min(15vw,250px);background:linear-gradient(90deg,transparent,#b48643)}
.ornament:after{background:linear-gradient(90deg,#b48643,transparent)}
.diamond{width:.7vw;height:.7vw;min-width:8px;min-height:8px;background:#b48643;transform:rotate(45deg)}
h1{margin:0;font-weight:400;font-size:clamp(64px,9.3vw,175px);line-height:.92;letter-spacing:-.035em;text-shadow:0 2px 1px rgba(255,255,255,.9),0 8px 24px rgba(116,73,25,.10)}
.amp{display:inline-block;font-style:italic;font-size:.72em;margin:0 .03em;color:#ad7d39;transform:translateY(.03em)}
.sub{margin-top:4.7vh;font-family:Arial,sans-serif;font-size:clamp(18px,1.65vw,34px);letter-spacing:.42em;text-transform:uppercase;color:#8c6739}
.date{margin-top:2.2vh;font-family:Arial,sans-serif;font-size:clamp(14px,1.05vw,22px);letter-spacing:.22em;color:#aa8657}
.ring{position:absolute;left:50%;bottom:6.3vh;transform:translateX(-50%);width:62px;height:31px;opacity:.8}
.ring:before,.ring:after{content:"";position:absolute;width:27px;height:27px;border:2px solid #b68b4a;border-radius:50%;top:0}
.ring:before{left:5px}.ring:after{right:5px}
.hint{position:fixed;left:50%;bottom:1.2vh;transform:translateX(-50%);font:12px Arial,sans-serif;letter-spacing:.12em;color:rgba(101,69,31,.45);opacity:1;transition:opacity .5s}
@media (max-aspect-ratio:4/3){h1{font-size:clamp(56px,12vw,150px)}.corner{width:34vw;height:34vw}.eyebrow{letter-spacing:.25em}.sub{letter-spacing:.25em}}
</style>
</head>
<body>
<main class="screen">
<div class="glow g1"></div><div class="glow g2"></div>
<div class="corner tl" aria-hidden="true"><svg viewBox="0 0 400 400" fill="none" stroke="currentColor" stroke-width="2"><path d="M0 95C86 97 118 59 149 0M0 153c115 3 154-49 186-153M50 0c-4 88-23 134-50 170"/><path d="M23 85c32-39 64-55 96-58-3 32-25 58-63 75M53 131c43-33 79-42 112-35-10 34-38 55-83 62M92 60c20-31 42-49 70-55 2 29-12 54-44 75M6 138c22-20 45-28 69-24-8 24-25 39-54 46" fill="rgba(183,139,74,.09)"/></svg></div>
<div class="corner tr" aria-hidden="true"><svg viewBox="0 0 400 400" fill="none" stroke="currentColor" stroke-width="2"><path d="M0 95C86 97 118 59 149 0M0 153c115 3 154-49 186-153M50 0c-4 88-23 134-50 170"/></svg></div>
<div class="corner bl" aria-hidden="true"><svg viewBox="0 0 400 400" fill="none" stroke="currentColor" stroke-width="2"><path d="M0 95C86 97 118 59 149 0M0 153c115 3 154-49 186-153M50 0c-4 88-23 134-50 170"/></svg></div>
<div class="corner br" aria-hidden="true"><svg viewBox="0 0 400 400" fill="none" stroke="currentColor" stroke-width="2"><path d="M0 95C86 97 118 59 149 0M0 153c115 3 154-49 186-153M50 0c-4 88-23 134-50 170"/><path d="M23 85c32-39 64-55 96-58-3 32-25 58-63 75M53 131c43-33 79-42 112-35-10 34-38 55-83 62M92 60c20-31 42-49 70-55 2 29-12 54-44 75M6 138c22-20 45-28 69-24-8 24-25 39-54 46" fill="rgba(183,139,74,.09)"/></svg></div>
<section class="content">
<div class="eyebrow">Nişan Töreni</div>
<div class="ornament"><span class="diamond"></span></div>
<h1>Mehmet <span class="amp">&amp;</span> Fatma</h1>
<div class="sub">Mutluluğumuza Hoş Geldiniz</div>
<div class="date">19 Temmuz 2026</div>
</section>
<div class="ring" aria-hidden="true"></div>
</main>
<div class="hint">TAM EKRAN İÇİN BİR KEZ TIKLAYIN</div>
<script>
async function full(){try{if(!document.fullscreenElement&&document.documentElement.requestFullscreen){await document.documentElement.requestFullscreen()}}catch(e){}document.querySelector('.hint').style.opacity='0'}
document.addEventListener('click',full,{once:true});
document.addEventListener('keydown',full,{once:true});
setTimeout(()=>document.querySelector('.hint').style.opacity='0',8000);
</script>
</body>
</html>
