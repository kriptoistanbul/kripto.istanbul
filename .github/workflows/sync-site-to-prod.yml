name: Sync _site to prod branch

on:
  push:
    branches: [gh-pages]

jobs:
  sync-to-prod:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout gh-pages branch
      uses: actions/checkout@v4
      with:
        ref: gh-pages
        fetch-depth: 0

    - name: Configure Git
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'

    - name: Check if _site folder exists
      run: |
        if [ ! -d "_site" ]; then
          echo "Error: _site folder not found in gh-pages branch"
          exit 1
        fi
        echo "_site folder found with $(find _site -type f | wc -l) files"

    - name: Create/switch to prod branch
      run: |
        # Fetch all branches
        git fetch origin
        
        # Check if prod branch exists on remote
        if git show-ref --verify --quiet refs/remotes/origin/prod; then
          echo "Prod branch exists, checking it out"
          git checkout prod
          git pull origin prod
        else
          echo "Creating new prod branch"
          git checkout --orphan prod
          git rm -rf . 2>/dev/null || true
        fi

    - name: Clear prod branch content (keep .git and .github)
      run: |
        # Remove all files except .git and .github
        find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' -exec rm -rf {} + 2>/dev/null || true

    - name: Copy _site contents to prod branch
      run: |
        # Get _site folder from gh-pages branch
        git checkout gh-pages -- _site
        
        # Move everything from _site to root
        if [ -d "_site" ]; then
          # Move visible files
          find _site -mindepth 1 -maxdepth 1 -exec mv {} . \; 2>/dev/null || true
          # Remove empty _site directory
          rmdir _site 2>/dev/null || true
        fi
        
        # List what we have now
        echo "Files in prod branch root:"
        ls -la

    - name: Commit and push changes
      run: |
        git add .
        
        # Check if there are changes to commit
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "Auto-sync from gh-pages _site folder ($(date))"
          git push origin prod
          echo "✅ Successfully pushed changes to prod branch"
        fi
